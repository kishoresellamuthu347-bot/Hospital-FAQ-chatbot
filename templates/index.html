<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hospital FAQ Chatbot</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <h1>Hospital FAQ Chatbot</h1>

    <p class="subtitle">
        Ask questions about hospital services and facilities.
    </p>


    <div id="chatbox">

        <div id="messages">

            <div class="message bot">

                <b>Bot:</b>
                Hello! How can I help you with hospital information?

            </div>

        </div>

    </div>


    <div class="input-section">

        <input
            type="text"
            id="question"
            placeholder="Ask your hospital question..."
        >

        <button onclick="sendQuestion()">
            Send
        </button>

    </div>


    <button
        class="clear-button"
        onclick="clearChat()">

        Clear Chat

    </button>

</div>


<script>

async function sendQuestion() {

    const input =
        document.getElementById("question");

    const question =
        input.value.trim();

    const messages =
        document.getElementById("messages");


    if (question === "") {

        return;

    }


    // Display user message

    messages.innerHTML += `

        <div class="message user">

            <b>You:</b> ${question}

        </div>

    `;


    input.value = "";


    try {

        const response =
            await fetch("/chat", {

                method: "POST",

                headers: {

                    "Content-Type":
                        "application/json"

                },

                body: JSON.stringify({

                    question: question

                })

            });


        const data =
            await response.json();


        // Display bot response

        messages.innerHTML += `

            <div class="message bot">

                <b>Bot:</b> ${data.answer}

            </div>

        `;

    }

    catch (error) {

        messages.innerHTML += `

            <div class="message bot">

                <b>Bot:</b>
                Unable to connect to the server.

            </div>

        `;

    }


    // Scroll to bottom

    document.getElementById("chatbox").scrollTop =
        document.getElementById("chatbox").scrollHeight;


    input.focus();

}


// Enter key

document
    .getElementById("question")
    .addEventListener(
        "keypress",
        function(event) {

            if (event.key === "Enter") {

                sendQuestion();

            }

        }
    );


// Clear chat

function clearChat() {

    document.getElementById("messages").innerHTML = `

        <div class="message bot">

            <b>Bot:</b>
            Hello! How can I help you with hospital information?

        </div>

    `;

}

</script>

</body>

</html>
